<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpringServe Tiles Ads</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        #content {
            width: 1280px;
            height: 720px;
            margin: 0 auto;
        }

        #adContainerLayer1 {
            top: 90px;
            left: 50px;
            transform-origin: top left;
        }

        #adContainerLayer2 {
            top: 0px;
            left: 0px;
            transform-origin: top left;
        }
    </style>
</head>

<body>
    <div class="container-fluid bg-dark">
        <a class="text-decoration-none" href="https://www.magnite.com/sellers/">
            <img class="img-fluid align-middle" src="logo.png" alt="SpringServe Logo">
            <span class="text-white align-middle fs-2">SpringServe Tiles Ad</span>
        </a>
    </div>

    <div class="container mt-1">

        <!-- Layer 1 Controls -->
        <div class="input-group  font-monospace">
            <label class="input-group-text bg-secondary text-white fs-6 ms-2" for="ad-tag-layer1">Tile 1</label>
            <input class="form-control fs-6 me-1" id="ad-tag-layer1" type="url"
                value="https://tiles.springserve.com/nvr/21133?w=1920&h=1080&content_keywords=cruise">
            <button class="btn btn-success me-1" id="squeezeback">Squeeze</button>
            <button class="btn btn-primary me-1" id="get_tiles1">ON Tile 1</button>
            <button class="btn btn-info me-2" id="clear_tiles1">OFF Tile 1</button>
        </div>

        <!-- Layer 2 Controls -->
        <div class="input-group mt-1 font-monospace">
            <label class="input-group-text bg-secondary text-white fs-6 ms-2" for="ad-tag-layer2">Tile 2</label>
            <input class="form-control fs-6 me-1" id="ad-tag-layer2" type="url"
                value="https://tiles.springserve.com/nvr/21133?w=1920&h=1080&content_keywords=L1">
            <button class="btn btn-dark me-1" id="full">Full Frame</button>
            <button class="btn btn-primary me-1" id="get_tiles2">ON Tile 2</button>
            <button class="btn btn-info me-2" id="clear_tiles2">OFF Tile 2</button>
        </div>

        <!-- Range Controls -->
        <div class="container mt-1">
            <form class="my-0">
                <div class="container border border-secondary d-inline p-1 me-5">
                    <label class="form-label fs-6">Vertical Position:</label>
                    <input type="text" id="vpos_value" value="90" style="width: 50px; border: 0">
                    <input type="range" id="vertical_pos" min="-720" max="1440" step="1" value="90">
                </div>

                <div class="container border border-secondary d-inline p-1 me-5">
                    <label class="form-label fs-6">Horizontal Position:</label>
                    <input type="text" id="hpos_value" value="50" style="width: 50px; border: 0">
                    <input type="range" id="horizontal_pos" min="-1280" max="2560" step="1" value="50">
                </div>

                <div class="container border border-secondary d-inline p-1 me-5">
                    <label class="form-label fs-6">Scale:</label>
                    <input type="text" id="scale_value" value="1" style="width: 40px; border: 0">
                    <input type="range" id="tiles_scale" min="0" max="3" step="0.01" value="1">
                </div>

                <div class="container d-inline">
                    <input type="reset" id="reset_values" value="Default Values">
                </div>
            </form>
        </div>

        <!-- Content Display -->
        <div class="position-relative mb-3" id="content">

            <div class="position-absolute" id="adContainerLayer2">
                <div id="nativeAdContainerLayer2"></div>
            </div>

            <div class="position-absolute">
                <video id="contentElement" width="1280" height="720" controls autoplay loop muted>
                    <source src="Tibet.webm" type="video/webm">
                </video>
            </div>

            <div class="position-absolute" id="adContainerLayer1">
                <div id="nativeAdContainerLayer1"></div>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const adContainer = document.getElementById("adContainerLayer1");
        const nativeAdContainer = document.getElementById("nativeAdContainerLayer1");

        const adContainerLayer2 = document.getElementById("adContainerLayer2");
        const nativeAdContainerLayer2 = document.getElementById("nativeAdContainerLayer2");

        const verticalInput = document.getElementById("vpos_value");
        const verticalSlider = document.getElementById("vertical_pos");
        const horizontalInput = document.getElementById("hpos_value");
        const horizontalSlider = document.getElementById("horizontal_pos");
        const scaleInput = document.getElementById("scale_value");
        const scaleSlider = document.getElementById("tiles_scale");

        const video = document.getElementById("contentElement");
        const getTile1Btn = document.getElementById("get_tiles1");

        // Pause → Load Tiles
        video.addEventListener("pause", () => {
            if (!video.ended) getTile1Btn.click();
        });

        // Play → Clear Tiles
        const clearTiles1Btn = document.getElementById("clear_tiles1");
        const clickClearOnPlay = () => {
            if (!video.paused) clearTiles1Btn.click();
        };

        video.addEventListener("play", clickClearOnPlay);
        video.addEventListener("playing", clickClearOnPlay);

        // Slider / Input Sync
        verticalSlider.addEventListener("input", function () {
            adContainer.style.top = this.value + "px";
            verticalInput.value = this.value;
        });

        horizontalSlider.addEventListener("input", function () {
            adContainer.style.left = this.value + "px";
            horizontalInput.value = this.value;
        });

        scaleSlider.addEventListener("input", function () {
            adContainer.style.transform = `scale(${this.value})`;
            scaleInput.value = this.value;
        });

        verticalInput.addEventListener("input", function () {
            const value = Number(this.value);
            if (!isNaN(value)) {
                adContainer.style.top = value + "px";
                verticalSlider.value = value;
            }
        });

        horizontalInput.addEventListener("input", function () {
            const value = Number(this.value);
            if (!isNaN(value)) {
                adContainer.style.left = value + "px";
                horizontalSlider.value = value;
            }
        });

        scaleInput.addEventListener("input", function () {
            const value = Number(this.value);
            if (!isNaN(value)) {
                adContainer.style.transform = `scale(${value})`;
                scaleSlider.value = value;
            }
        });

        // Reset to Default Values
        document.getElementById("reset_values").addEventListener("click", () => {
            verticalSlider.value = verticalInput.value = 90;
            horizontalSlider.value = horizontalInput.value = 50;
            scaleSlider.value = scaleInput.value = 1;

            adContainer.style.top = "90px";
            adContainer.style.left = "50px";
            adContainer.style.transform = "scale(1)";
        });

        // Animation Helper
        function animateScale(element, targetScale, duration = 500) {
            // Ensure it always scales from top-left
            element.style.transformOrigin = "top left";

            const style = window.getComputedStyle(element);
            const startMatrix = new DOMMatrixReadOnly(style.transform === "none" ? "" : style.transform);
            const startScale = startMatrix.a || 1;

            const startTime = performance.now();

            const step = (now) => {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const scale = startScale + (targetScale - startScale) * progress;

                element.style.transform = `scale(${scale})`;

                if (progress < 1) requestAnimationFrame(step);
            };

            requestAnimationFrame(step);
        }

        // Video Scale Controls
        document.getElementById("squeezeback").addEventListener("click", () => {
            animateScale(video, 0.73);
        });

        document.getElementById("full").addEventListener("click", () => {
            animateScale(video, 1.0);
        });

        // Fetch Tiles (Layer 1)
        document.getElementById("get_tiles1").addEventListener("click", async () => {
            try {
                const tilesUrl = document.getElementById("ad-tag-layer1").value;
                const response = await fetch(tilesUrl);
                if (!response.ok) throw new Error("HTTP " + response.status);

                const data = await response.json();

                const adm = JSON.parse(data?.seatbid?.[0]?.bid?.[0]?.adm || "{}");
                const imgUrl = adm?.native?.assets?.[0]?.img?.url;
                if (!imgUrl) return;

                const img = document.createElement("img");
                img.src = imgUrl;

                nativeAdContainer.innerHTML = "";
                nativeAdContainer.appendChild(img);

                fetch(adm?.native?.imptrackers?.[0]).catch(() => { });
            } catch (err) {
                console.error(err);
            }
        });

        // Fetch Tiles (Layer 2)
        document.getElementById("get_tiles2").addEventListener("click", async () => {
            try {
                const tilesUrl = document.getElementById("ad-tag-layer2").value;
                const response = await fetch(tilesUrl);
                if (!response.ok) throw new Error("HTTP " + response.status);

                const data = await response.json();

                const adm = JSON.parse(data?.seatbid?.[0]?.bid?.[0]?.adm || "{}");
                const imgUrl = adm?.native?.assets?.[0]?.img?.url;
                if (!imgUrl) return;

                const img = document.createElement("img");
                img.src = imgUrl;

                nativeAdContainerLayer2.innerHTML = "";
                nativeAdContainerLayer2.appendChild(img);

                fetch(adm?.native?.imptrackers?.[0]).catch(() => { });
            } catch (err) {
                console.error(err);
            }
        });

        // Clear buttons
        document.getElementById("clear_tiles1").addEventListener("click", () => {
            nativeAdContainer.innerHTML = "";
        });

        document.getElementById("clear_tiles2").addEventListener("click", () => {
            nativeAdContainerLayer2.innerHTML = "";
        });
    </script>
</body>

</html>
