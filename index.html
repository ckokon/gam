<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SpringServe Tiles Ads</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <style>
        #content {
            width: 1280px;
            height: 720px;
            margin: 0 auto 0 auto;

            /* IMPORTANT: make #content the clipping + positioning container */
            position: relative;
            overflow: hidden; /* <-- clips anything that goes outside the 1280x720 area */
        }

        #adContainer {
            top: 90px;
            left: 50px;
            transform-origin: top left;
        }

        /* Optional: avoid tiny baseline gaps under video */
        #contentElement {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container-fluid bg-dark">
        <a class="text-decoration-none" href="https://www.magnite.com/sellers/">
            <img class="img-fluid align-middle" src="logo.png" alt="SpringServe Logo">
            <span class="text-white align-middle fs-2">SpringServe Tiles Ad</span>
        </a>
    </div>
    <div class="container mt-1">
        <div class="input-group">
            <label class="input-group-text bg-dark text-white fs-6 ms-2" for="ad-tag-input">Tiles URL:</label>
            <input class="form-control fs-6" id="ad-tag-input" type="url" name="input-tag"
                value="https://tiles.springserve.com/nvr/21133?w=1920&h=1080&content_keywords=tpl">
            <button class="btn btn-primary ms-1" id="get_tiles" type="button">Load</button>
            <button class="btn btn-info ms-1 me-2" id="clear_tiles" type="button">Unload</button>
        </div>
        <div class="container mt-1">
            <form class="my-0">
                <div class="container border border-secondary d-inline p-1 me-5">
                    <label class="form-label fs-6" for="vpos_value">Vertical Position:</label>
                    <input type="text" id="vpos_value" value="90" style="width: 50px; border: 0">
                    <input type="range" id="vertical_pos" min="-720" max="1440" step="1" value="90">
                </div>
                <div class="container border border-secondary d-inline p-1 me-5">
                    <label class="form-label fs-6" for="hpos_value">Horizontal Position:</label>
                    <input type="text" id="hpos_value" value="50" style="width: 50px; border: 0">
                    <input type="range" id="horizontal_pos" min="-1280" max="2560" step="1" value="50">
                </div>
                <div class="container border border-secondary d-inline p-1 me-5">
                    <label class="form-label fs-6" for="scale_value">Scale:</label>
                    <input type="text" id="scale_value" value="1" style="width: 40px; border: 0">
                    <input type="range" id="tiles_scale" min="0" max="3" step="0.01" value="1">
                </div>
                <div class="container d-inline">
                    <input type="reset" id="reset_values" value="Default Values">
                </div>
            </form>
        </div>

        <!-- #content now clips children because of overflow:hidden -->
        <div class="position-relative mb-3" id="content">
            <div class="position-absolute">
                <video id="contentElement" width="1280" height="720" controls autoplay loop muted>
                    <source src="https://assets.springserve.com/video_creatives/001/149/002/Tibet-8020539.mp4"
                        type="video/mp4">
                </video>
            </div>

            <div class="position-absolute" id="adContainer">
                <div id="nativeAdContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const adContainer = document.getElementById("adContainer");
        const nativeAdContainer = document.getElementById("nativeAdContainer");

        const verticalInput = document.getElementById("vpos_value");
        const verticalSlider = document.getElementById("vertical_pos");
        const horizontalInput = document.getElementById("hpos_value");
        const horizontalSlider = document.getElementById("horizontal_pos");
        const scaleInput = document.getElementById("scale_value");
        const scaleSlider = document.getElementById("tiles_scale");

        // Video and buttons
        const video = document.getElementById("contentElement");
        const getTilesBtn = document.getElementById("get_tiles");
        const clearTilesBtn = document.getElementById("clear_tiles");

        // When video is paused → click Get Tiles
        video.addEventListener("pause", () => {
            if (!video.ended) getTilesBtn.click();
        });

        // When playback resumes → click Clear Tiles
        const clickClearOnPlay = () => {
            if (!video.paused) clearTilesBtn.click();
        };
        video.addEventListener("play", clickClearOnPlay);
        video.addEventListener("playing", clickClearOnPlay);

        // Update container when range sliders change
        verticalSlider.addEventListener("input", function () {
            adContainer.style.top = this.value + "px";
            verticalInput.value = this.value;
        });

        horizontalSlider.addEventListener("input", function () {
            adContainer.style.left = this.value + "px";
            horizontalInput.value = this.value;
        });

        scaleSlider.addEventListener("input", function () {
            adContainer.style.transform = `scale(${this.value})`;
            scaleInput.value = this.value;
        });

        // Update container when input fields change
        verticalInput.addEventListener("input", function () {
            const value = parseInt(this.value, 10);
            if (!isNaN(value) && value >= parseInt(verticalSlider.min) && value <= parseInt(verticalSlider.max)) {
                adContainer.style.top = value + "px";
                verticalSlider.value = value;
            }
        });

        horizontalInput.addEventListener("input", function () {
            const value = parseInt(this.value, 10);
            if (!isNaN(value) && value >= parseInt(horizontalSlider.min) && value <= parseInt(horizontalSlider.max)) {
                adContainer.style.left = value + "px";
                horizontalSlider.value = value;
            }
        });

        scaleInput.addEventListener("input", function () {
            const value = parseFloat(this.value);
            if (!isNaN(value) && value >= parseFloat(scaleSlider.min) && value <= parseFloat(scaleSlider.max)) {
                adContainer.style.transform = `scale(${value})`;
                scaleSlider.value = value;
            }
        });

        // Reset values
        document.getElementById("reset_values").addEventListener("click", () => {
            verticalSlider.value = 90;
            verticalInput.value = 90;
            horizontalSlider.value = 50;
            horizontalInput.value = 50;
            scaleSlider.value = 1;
            scaleInput.value = 1;

            adContainer.style.top = "90px";
            adContainer.style.left = "50px";
            adContainer.style.transform = "scale(1)";
        });

        // Clear tiles
        document.getElementById("clear_tiles").addEventListener("click", () => {
            nativeAdContainer.innerHTML = "";
        });

        // Fetch tiles
        document.getElementById("get_tiles").addEventListener("click", async () => {
            try {
                const tilesUrl = document.getElementById("ad-tag-input").value;
                const response = await fetch(tilesUrl);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

                const data = await response.json();
                const adm = JSON.parse(data.seatbid[0].bid[0].adm);
                const imgUrl = adm.native.assets[0].img.url;

                const img = document.createElement("img");
                img.src = imgUrl;

                if (nativeAdContainer.firstChild) {
                    nativeAdContainer.replaceChild(img, nativeAdContainer.firstChild);
                } else {
                    nativeAdContainer.appendChild(img);
                }

                // Fire impression tracker
                await fetch(adm.native.imptrackers[0]);
            } catch (error) {
                console.error(`Error: ${error.message}`);
            }
        });
    </script>
</body>

</html>
